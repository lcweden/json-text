name: Continuous Integration

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true

      - name: Check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Test
        run: deno task test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
